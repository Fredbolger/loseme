services:
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    image: loseme-core:latest

  server:
    runtime: nvidia
    build:
      context: .
      dockerfile: server/Dockerfile
    image: loseme-server:latest
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LOSEME_DEVICE_ID=${LOSEME_DEVICE_ID:-server}
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - metadata:/var/lib/loseme/metadata
      - hf_cache:/root/.cache/huggingface
      - ${LOSEME_HOST_ROOT}:/mnt/userdata
    command: uvicorn api.app.main:app --host 0.0.0.0 --port 8000 --log-level info
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    depends_on:
      qdrant:
        condition: service_healthy
      core:
        condition: service_completed_successfully
    env_file:
      - .env.server

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s


volumes:
  qdrant_data:
  metadata:
  hf_cache:
