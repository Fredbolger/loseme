services:
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    image: loseme-core:latest

  client:
    build:
      context: .
      dockerfile: client/npm/Dockerfile
    image: loseme-client-npm:latest
    ports:
      - "3000:3000"
    env_file:
      - .env.client
    environment:
      - NODE_ENV=production
    volumes:
      - ${LOSEME_HOST_ROOT}:/mnt/userdata
    depends_on:
      core:
        condition: service_completed_successfully
      ingest-sidecar:
        condition: service_started

  # Ingest sidecar - Python service for file ingestion
  # Runs the legacy Python client code for filesystem/thunderbird ingestion
  ingest-sidecar:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: loseme-ingest-sidecar:latest
    ports:
      - "3001:3000"
    env_file:
      - .env.client
    environment:
      - PYTHONPATH=/app
    volumes:
      - ${LOSEME_HOST_ROOT}:/mnt/userdata
    depends_on:
      core:
        condition: service_completed_successfully
